[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-cli"
version = "0.2.0"
description = "Local research library and quote-checking CLI"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
lumi = "lumi.cli:main"

[tool.setuptools]
packages = ["engine", "lumi"]

[tool.setuptools.data-files]
"share/lumi" = ["lumi.py"]
"share/lumi/templates" = ["templates/AGENTS.md", "templates/CONTEXT.md", "templates/questions.md", "templates/gitignore", "templates/lumi"]
"share/lumi/skills/lumi-research" = ["skills/lumi-research/SKILL.md"]
